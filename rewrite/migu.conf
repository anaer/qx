# ^https?:\/\/app\.(c|pd)\.nf\.migu\.cn\/.*\/(listen-url|music\/batchQueryMusicPolicy|download-url).*$ url script-request-header https://raw.githubusercontent.com/anaer/qx/main/rewrite/migu.js