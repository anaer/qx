# > 七猫小说
# 本模块: https://raw.githubusercontent.com/anaer/qx/main/rewrite/7mao.conf
# 引用脚本: https://raw.githubusercontent.com/anaer/qx/main/rewrite/7mao.js
# 参考来源:
#   七猫去广告(lodepuly/vpn_tool)，reject-dict 策略与 hostname 收窄依据
#     https://clashios.app/stoverride/lodepuly_vpn_tool/SevenCat_remove_ads
#   七猫小说解锁(deezertidal/QuantumultX-Rewrite)，宽正则写法出处
#     https://raw.githubusercontent.com/deezertidal/QuantumultX-Rewrite/master/rewrite/qmxs.conf
#   api-ks.wtzw.com 是七猫的章节目录/正文接口域，别家规则均不处理，本模块也不 MITM（talebook#805）
#     https://github.com/talebook/talebook/issues/805
# 七猫自身会检测 MITM 与 VPN 状态，逐条枚举主机名，避免解密正文/账号接口导致 App 闪退
#
# 规则顺序即优先级：QX 重写自上而下首次命中即停止，因此需要独立动作的具体规则必须排在
# 文末那条宽正则脚本兜底规则之前，否则其动作静默失效。
hostname = a6-remad.qm989.com, t-remad.qm989.com, cdn-new-ad.wtzw.com, cdn.wtzw.com, api-cfg.wtzw.com, xiaoshuo.wtzw.com, api-bc.wtzw.com, api-gw.wtzw.com

# ===== 广告接口与静态资源 =====
# 广告 SDK 的 JSON 接口用 reject-dict 返回空对象；硬 reject 会让 SDK 解析失败而崩溃
^https:\/\/api\-cfg\.wtzw\.com\/v1\/(adv|reward|operation|offline-adv) url reject-dict
^https:\/\/a6\-remad\.qm989\.com/v\d/(get\-ads|get\-splash|get\-bid\-price|get\-contract)/index url reject-dict
^https:\/\/t\-remad\.qm989\.com/api/ad/union/sdk/v1/data url reject-dict
^https:\/\/cdn\-new\-ad\.wtzw\.com/commerce/attachment/.* url reject

# ===== 弹窗与运营位阻断（必须排在文末宽正则之前）=====
# 签到
^https:\/\/xiaoshuo\.wtzw\.com\/api\/v1\/user\/red-point url reject-dict
^https:\/\/api\-gw\.wtzw\.com\/legacy\/api\/v1\/user\/red-point\?act_time url reject-dict
# 书架运营位
^https:\/\/api\-bc\.wtzw\.com\/api\/v1\/book\-shelf\/operation url reject-dict
# 有声阅读界面广告横幅 开通会员, 无广告畅听
^https:\/\/api\-bc\.wtzw\.com\/api\/v1\/operation url reject-dict
# 腾格尔打卡喵喵歌
^https:\/\/api-bc\.wtzw\.com\/api\/v4\/search\/dispose url reject-dict
# 必读榜弹窗
^https:\/\/api-bc\.wtzw\.com\/api\/v1\/book-store\/config url reject-dict
# 推荐书籍弹窗
^https:\/\/api-bc\.wtzw\.com\/api\/v1\/book-store\/push-book url reject-dict

# ===== 响应改写（具体路径在前，宽正则兜底在最后）=====
# 正文底部推广
^https:\/\/cdn\.wtzw\.com\/bookimg\/free\/api\/v1\/reader\/reader-copy-paragraph-all\.json url script-response-body https://raw.githubusercontent.com/anaer/qx/main/rewrite/7mao.js

# 开屏广告：index 走改写（is_show_ad / adv / vip_status 等参数），其余 splash 路径由 reject-dict 兜底
^https:\/\/api\-cfg\.wtzw\.com\/v1\/splash\/index url script-response-body https://raw.githubusercontent.com/anaer/qx/main/rewrite/7mao.js
^https:\/\/api-cfg\.wtzw\.com\/v1\/splash\/ url reject-dict

^https:\/\/api\-gw\.wtzw\.com\/vip\/api\/v1\/index url script-response-body https://raw.githubusercontent.com/anaer/qx/main/rewrite/7mao.js
^https:\/\/api\-gw\.wtzw\.com\/vip\/app\/v1\/index url script-response-body https://raw.githubusercontent.com/anaer/qx/main/rewrite/7mao.js
^https:\/\/api\-bc\.wtzw\.com\/api\/v4\/book\/change url script-response-body https://raw.githubusercontent.com/anaer/qx/main/rewrite/7mao.js
^https:\/\/xiaoshuo\.wtzw\.com/api/v2/init url script-response-body https://raw.githubusercontent.com/anaer/qx/main/rewrite/7mao.js
^https:\/\/api\-bc\.wtzw\.com\/api\/v1\/book-store\/reader-recommend url script-response-body https://raw.githubusercontent.com/anaer/qx/main/rewrite/7mao.js

# 宽正则兜底：覆盖上面未穷举的 api-* 主机，必须位于本模块所有具体规则之后
^https:\/\/(api\-\w+|xiaoshuo)\.wtzw\.com\/api\/v\d\/ url script-response-body https://raw.githubusercontent.com/anaer/qx/main/rewrite/7mao.js

# ===== 保持不启用 =====
# 本章说：api-cmnt.wtzw.com 不在 hostname 内，启用也不会被解密；别家规则均未处理
#^https:\/\/api\-cmnt\.wtzw\.com\/api\/v1\/comment\/chapter-end-comment url reject-dict

# 启动配置类主流程接口：交上面的脚本改写，不做阻断
#^https:\/\/xiaoshuo\.wtzw\.com\/api\/v2\/init\/other-data url reject-dict

# 章节正文/目录接口域。本条位于前面的宽正则脚本规则之后，首次命中即停止，故永不生效；
# api-ks.wtzw.com 也不在上面的 hostname 列表内，不会被解密。保留本条仅作说明。
#^https:\/\/api-ks\.wtzw\.com\/api\/v1\/chapter\/data url reject-dict
